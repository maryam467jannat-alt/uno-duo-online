<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>UNO Duo Online</title>
<style>
:root{--bg:#101827;--panel:#1b2739;--text:#f5f7fb;--muted:#aab6c8;--accent:#6ee7b7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24364f,#101827 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{padding:18px 16px 8px;text-align:center}h1{margin:0;font-size:clamp(26px,7vw,38px);letter-spacing:1px}h1 span{color:#f87171}header p{color:var(--muted);margin:5px 0}
main{max-width:760px;margin:auto;padding:12px;display:grid;gap:12px}.panel{background:#1b2739eF;border:1px solid #ffffff17;border-radius:18px;padding:14px;box-shadow:0 10px 30px #0002}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #ffffff25}input{background:#0d1522;color:white;min-width:0;width:100%}button{background:#2e4059;color:white;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#10251e;border:0}button:disabled{opacity:.4;cursor:not-allowed}.small{font-size:13px;color:var(--muted)}#status{font-weight:700;color:var(--accent);margin-bottom:8px}#message{color:#dce5f3;min-height:22px}.arena{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{padding:10px;border-radius:14px;background:#101827;text-align:center;border:1px solid #ffffff14}.player.active{border-color:var(--accent);box-shadow:0 0 0 1px #6ee7b733}.num{font-size:22px;font-weight:800}.table{display:flex;align-items:center;justify-content:center;gap:18px;min-height:150px}.pile{text-align:center}.pile label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.card{width:62px;height:92px;border:3px solid #fff;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;text-shadow:0 1px 2px #0008;box-shadow:0 5px 12px #0004;position:relative;transform:rotate(-3deg);flex-shrink:0}.card:before{content:"";position:absolute;inset:6px 10px;border:2px solid #ffffff99;border-radius:50%;transform:rotate(-25deg)}.card span{position:relative;z-index:1}.red{background:#e83c4b}.blue{background:#287ee8}.green{background:#1ca875}.yellow{background:#e9bb2f;color:#17202c;text-shadow:none}.wild{background:conic-gradient(#e83c4b 0 25%,#287ee8 0 50%,#1ca875 0 75%,#e9bb2f 0)}.back{background:linear-gradient(135deg,#c92b44,#542bd1)}.hand{display:flex;gap:8px;overflow-x:auto;padding:12px 3px 16px;min-height:122px;align-items:center}.hand .card{width:58px;height:86px;cursor:pointer;transition:transform .16s,margin .16s}.hand .card:active{transform:translateY(-9px) scale(1.04)}.hand .card:disabled{opacity:.5}.section-title{font-size:14px;color:var(--muted);margin:0 0 4px}.hidden{display:none!important}.footer{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 18px}
@media(min-width:600px){.card{width:74px;height:108px;font-size:24px}.hand .card{width:68px;height:100px}}

/* UNO Duo visual upgrade */
body {
  background:
    radial-gradient(ellipse at 50% 0%, #354f79 0%, transparent 55%),
    linear-gradient(160deg, #111a2d, #090f1c);
  background-attachment: fixed;
}
.panel {
  background: linear-gradient(145deg, #24344cF5, #141e30F5);
  border: 1px solid #ffffff22;
  box-shadow: 0 12px 32px #0004, inset 0 1px #ffffff0a;
}
h1 {
  text-shadow: 0 4px 22px #0006;
}
h1 span {
  color: #fb7185;
  text-shadow: 0 0 20px #fb718566;
}
button {
  transition: transform .16s, filter .16s, box-shadow .16s;
}
button:not(:disabled):active {
  transform: scale(.96);
  filter: brightness(1.15);
}
button.primary {
  background: linear-gradient(135deg, #6ee7b7, #34d399);
  box-shadow: 0 5px 16px #34d39930;
}
.card {
  border: 3px solid #fff;
  border-radius: 13px 13px 17px 13px;
  box-shadow: 0 7px 15px #0005, inset 0 0 0 2px #ffffff18;
  transition: transform .2s, box-shadow .2s;
}
.hand .card:not(:disabled):hover {
  transform: translateY(-10px) rotate(0deg) scale(1.06);
  box-shadow: 0 12px 22px #0007;
  z-index: 2;
}
.hand .card:focus-visible {
  outline: 3px solid #6ee7b7;
  outline-offset: 3px;
}
.player {
  transition: border-color .2s, box-shadow .2s;
}
.player.active {
  border-color: #6ee7b7;
  box-shadow: 0 0 18px #6ee7b733, inset 0 0 16px #6ee7b70a;
}
.table {
  border-radius: 18px;
  background: #080f1b45;
  margin-top: 12px;
}
#soundToggle {
  margin: 8px auto 0;
  display: block;
  border-radius: 24px;
  padding: 8px 16px;
  background: #253751;
  border-color: #ffffff25;
}
#status {
  text-shadow: 0 0 14px #6ee7b744;
}
#message {
  line-height: 1.5;
}
@keyframes cardAppear {
  from { opacity: .4; transform: translateY(8px) scale(.94); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.hand .card {
  animation: cardAppear .2s ease-out both;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<header><h1>UNO <span>DUO</span></h1><p>Two-player online card battle</p><button id="soundToggle" type="button">🔊 Sound ON</button></header>
<main>
<section class="panel" id="lobby">
  <p class="section-title">PLAYER NAME</p>
  <div class="row"><input id="name" maxlength="18" placeholder="Your name" value="Player"></div>
  <div class="row" style="margin-top:8px"><button class="primary" id="create">Create Room</button><input id="roomCode" maxlength="6" placeholder="ROOM CODE" autocapitalize="characters"><button id="join">Join</button></div>
  <p class="small">Create a room, then send the 6-character code to your friend.</p>
</section>
<section class="panel hidden" id="game">
  <div id="status">Connecting…</div>
  <div class="row"><div><span class="small">ROOM CODE</span><div class="num" id="code">------</div></div><button id="copy">Copy Code</button><button id="share">Share</button></div>
  <div class="arena" style="margin-top:12px">
    <div class="player" id="p0"><div id="name0">Player 1</div><div class="num" id="count0">0 cards</div></div>
    <div class="player" id="p1"><div id="name1">Player 2</div><div class="num" id="count1">0 cards</div></div>
  </div>
  <div class="table">
    <div class="pile"><label>DRAW PILE</label><button class="card back" id="draw"><span>＋</span></button><div class="small" id="deckCount"></div></div>
    <div class="pile"><label>TOP CARD</label><div class="card red" id="top"><span>?</span></div><div class="small" id="currentColor">Color: —</div></div>
  </div>
  <div id="message"></div>
  <p class="section-title" style="margin-top:10px">YOUR CARDS — tap a card to play</p>
  <div class="hand" id="hand"></div>
  <div class="row"><button id="uno">UNO! (last card)</button><button id="newGame" class="hidden">New Room</button></div>
</section>
<div class="footer">UNO-inspired fan game • Not affiliated with or endorsed by Mattel.</div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
let soundEnabled = true;
let audioContext = null;

function playSound(kind = 'card') {
  if (!soundEnabled) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    if (!audioContext) audioContext = new Audio();
    if (audioContext.state === 'suspended') audioContext.resume();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const now = audioContext.currentTime;
    const notes = kind === 'draw' ? [330, 440] : [520, 660];
    osc.type = 'sine';
    osc.frequency.setValueAtTime(notes[0], now);
    osc.frequency.setValueAtTime(notes[1], now + 0.07);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.09, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now + 0.17);
  } catch (e) {}
}

document.getElementById('soundToggle').onclick = () => {
  soundEnabled = !soundEnabled;
  document.getElementById('soundToggle').textContent =
    soundEnabled ? '🔊 Sound ON' : '🔇 Sound OFF';
  if (soundEnabled) playSound('card');
};

const socket = io();
const $ = id => document.getElementById(id);
let gameState = null, myCode = "";
const label = v => ({skip:"SKIP",reverse:"REV",draw2:"+2",wild:"WILD",wild4:"+4"}[v] || v);
function showError(msg){ $("message").textContent = msg; }
function colorName(c){return ({red:"Red",blue:"Blue",green:"Green",yellow:"Yellow",wild:"Wild"})[c]||c;}
function cardNode(card, clickable=false, index=-1){
  const b=document.createElement("button");
  b.className="card "+(card.color||"wild");
  b.innerHTML="<span>"+label(card.value)+"</span>";
  if(!clickable)b.disabled=true;
  if(clickable)b.addEventListener("click",()=>{playSound("card");play(index,card);});
  return b;
}
function canPlayLocal(card){
  if(!gameState)return false;
  return card.color==="wild" || card.color===gameState.currentColor || card.value===gameState.top.value;
}
function render(s){
  gameState=s; myCode=s.code;
  $("lobby").classList.add("hidden"); $("game").classList.remove("hidden");
  $("code").textContent=s.code;
  $("status").textContent=s.status==="waiting"?"Waiting for your friend to join…":s.status==="finished"?(s.winner+" wins! 🎉"):(s.turn===s.you?"YOUR TURN":"OPPONENT'S TURN");
  $("p0").classList.toggle("active",s.status==="playing"&&s.turn===0);
  $("p1").classList.toggle("active",s.status==="playing"&&s.turn===1);
  s.players.forEach((p,i)=>{$("name"+i).textContent=p.name+(p.isYou?" (You)":"");$("count"+i).textContent=p.count+" cards";});
  $("top").className="card "+s.top.color; $("top").innerHTML="<span>"+label(s.top.value)+"</span>";
  $("currentColor").textContent="Color: "+colorName(s.currentColor);
  $("deckCount").textContent=s.deckCount+" cards left";
  $("message").textContent=s.lastMessage||"";
  const hand=$("hand"); hand.innerHTML="";
  const myTurn=s.status==="playing"&&s.turn===s.you;
  s.hand.forEach((c,i)=>{
    const node=cardNode(c,myTurn&&canPlayLocal(c),i);
    if(!myTurn||!canPlayLocal(c))node.style.opacity=".55";
    hand.appendChild(node);
  });
  $("draw").disabled=!myTurn;
  $("uno").disabled=!myTurn||s.hand.length!==1;
  $("newGame").classList.toggle("hidden",s.status!=="finished");
}
function play(index,card){
  if(card.color==="wild"){
    const choice=prompt("Choose color: red, blue, green, yellow","red");
    if(!choice)return;
    const c=choice.trim().toLowerCase();
    if(!["red","blue","green","yellow"].includes(c))return showError("Choose red, blue, green, or yellow.");
    socket.emit("playCard",{index,color:c});
  }else socket.emit("playCard",{index});
}
$("create").onclick=()=>socket.emit("createRoom",{name:$("name").value});
$("join").onclick=()=>socket.emit("joinRoom",{code:$("roomCode").value,name:$("name").value});
$("draw").onclick=()=>{playSound("draw");socket.emit("drawCard");};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(myCode);showError("Room code copied!");}catch(e){showError("Room code: "+myCode);}};
$("share").onclick=async()=>{const text="Join my UNO Duo game! Room code: "+myCode+" — "+location.href;try{if(navigator.share)await navigator.share({title:"UNO Duo",text,url:location.href});else{await navigator.clipboard.writeText(text);showError("Invite text copied!");}}catch(e){}};
$("uno").onclick=()=>showError("UNO! You have one card left.");
$("newGame").onclick=()=>{location.reload();};
socket.on("joined",({code})=>{myCode=code;$("roomCode").value=code;});
socket.on("state",render);
socket.on("gameError",showError);
socket.on("connect",()=>{});
socket.on("disconnect",()=>showError("Connection lost. Refresh to reconnect."));
</script>
</body>
</html>
